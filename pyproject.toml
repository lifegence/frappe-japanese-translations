[project]
name = "frappe_japanese_translations"
authors = [
    { name = "Lifegence", email = "info@lifegence.co.jp" }
]
description = "Japanese (ja) translations for Frappe, ERPNext and related apps, packaged as an installable app"
license = { file = "LICENSE" }
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_japanese_translations"
